name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  iris-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Du_an_1_Iris_SVM/backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: integration_test
          POSTGRES_USER: test_runner
          POSTGRES_PASSWORD: integration-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_runner -d integration_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Du_an_1_Iris_SVM/backend/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - run: PYTHONPATH="${GITHUB_WORKSPACE}" python -m pytest -q
        env:
          PYTHONPATH: ${{ github.workspace }}
      - name: Smoke test against PostgreSQL
        run: python tests/postgres_smoke.py
        env:
          PYTHONPATH: ${{ github.workspace }}/Du_an_1_Iris_SVM/backend
          DATABASE_URL: postgresql://test_runner:integration-test-only@127.0.0.1:5432/integration_test
          RENDER: 'true'

  frontend-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: |
          node --check Du_an_1_Iris_SVM/frontend/script.js
          node --check Du_an_1_Iris_SVM/frontend/build-config.mjs

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify no hardcoded secrets or passwords
        run: |
          # Chỉ mã nguồn/cấu hình thật; file test dùng giá trị giả được bỏ qua.
          # Dòng chứa giá trị mẫu (your_..., change-in-production, os.getenv) được cho phép.
          MATCHES=$(grep -rnE "(OWNER_PASSWORD|JWT_SECRET|SECRET_KEY)[A-Za-z_]*[[:space:]]*[=:][[:space:]]*['\"]?[^[:space:]'\"$]{6,}" \
            --include=*.py --include=*.yaml --include=*.yml --include=*.example --include=*.md \
            --exclude-dir=tests --exclude-dir=.git . \
            | grep -vE "your_|change-in-production|os\.getenv|os\.environ|getenv\(|sync: false|<.*>|example\.com|localhost|ci\.yml" || true)
          if [ -n "$MATCHES" ]; then
            echo "$MATCHES"
            echo "Security violation: possible hardcoded secret or password (values hidden above are not printed beyond the matching line)."
            exit 1
          fi
          # Khóa riêng và token của các nhà cung cấp phổ biến
          if grep -rnE "BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{30,}|github_pat_[A-Za-z0-9_]{20,}" --exclude-dir=.git .; then
            echo "Security violation: private key or provider token committed!"
            exit 1
          fi
