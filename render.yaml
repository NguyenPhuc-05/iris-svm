databases:
  - name: iris-data-v2
    databaseName: iris_svm
    user: iris_api
    plan: free
    ipAllowList: []

services:
  - type: web
    name: iris-svm-api-v2
    runtime: python
    plan: free
    buildCommand: pip install -r Du_an_1_Iris_SVM/backend/requirements.txt
    startCommand: uvicorn backend.app.main:app --app-dir Du_an_1_Iris_SVM --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: CLIENT_ID
        value: iris-svm-api
      - key: JWT_SECRET
        sync: false
      - key: FRONTEND_ORIGINS
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: iris-data-v2
          property: connectionString

  - type: web
    name: iris-svm-frontend-v2
    runtime: static
    rootDir: Du_an_1_Iris_SVM/frontend
    buildCommand: node build-config.mjs
    staticPublishPath: .
    envVars:
      - key: IRIS_API_URL
        sync: false
      - key: IDP_API_URL
        sync: false
