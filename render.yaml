services:
  - type: web
    name: identity-service
    env: python
    plan: free 
    rootDir: identity_service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: JWT_SECRET
        sync: false
      - key: CLIENT_IDS
        value: iris-svm-api,breast-cancer-api
      - key: FRONTEND_ORIGINS
        value: https://iris-svm-frontend-6s3t.onrender.com,http://localhost:5500,http://127.0.0.1:5500,http://localhost:3000
      - key: OWNER_EMAIL
        value: admin@ml-dl-ai.local
      - key: OWNER_PASSWORD
        sync: false
      # Postgres bền vững cho tài khoản người dùng. Để trống thì dùng SQLite
      # tạm thời (mất dữ liệu mỗi lần Render khởi động lại).
      - key: IDP_DATABASE_URL
        sync: false

  - type: web
    name: iris-svm-api
    env: python
    plan: free 
    buildCommand: pip install -r Du_an_1_Iris_SVM/backend/requirements.txt
    startCommand: uvicorn backend.app.main:app --app-dir Du_an_1_Iris_SVM --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: CLIENT_ID
        value: iris-svm-api
      - key: JWT_SECRET
        sync: false
      - key: FRONTEND_ORIGINS
        value: https://iris-svm-frontend-6s3t.onrender.com,http://localhost:5500,http://127.0.0.1:5500,http://localhost:3000
      # Postgres/MySQL bền vững cho lịch sử dự đoán. Để trống thì dùng SQLite
      # tạm thời (mất dữ liệu mỗi lần Render khởi động lại).
      - key: DATABASE_URL
        sync: false

  - type: web
    name: iris-svm-frontend
    env: static
    rootDir: Du_an_1_Iris_SVM/frontend
    staticPublishPath: .
